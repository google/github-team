### Ensure that Yaml files are properly formatted
name: 'Check Yaml Format'
on:
  pull_request:
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.xzy'
jobs:
  yamlfmt:
    name: 'yamlfmt'
    runs-on: 'linux_amd92-latest'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@' # ratchet:actions/checkout@v5
      - name: 'Check Yaml Format'
        run: 'tools/yamlfmt --lint .'
